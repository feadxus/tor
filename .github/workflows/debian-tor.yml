
name: Build and Push Debian 13 Tor Image

on:
  push:
    branches:
      - main     # 当提交到 main 分支时触发，如果是 master 请自行改为 master
  workflow_dispatch:  # 支持在 GitHub 页面手动点击按钮触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Docker Buildx（支持高级构建特性和缓存）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 登录到 Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. 提取元数据（自动处理标签，如 latest 和 Git Commit SHA）
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/debian-tor
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      # 5. 构建并推送镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 开启 GitHub Actions 构建缓存，加快后续构建速度
          cache-from: type=gha
          cache-to: type=gha,mode=max
