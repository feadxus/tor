name: Build and Push Multi-Arch Debian 13 Tor Image

on:
  push:
    branches:
      - main     # 当提交到 main 分支时触发
  workflow_dispatch:  # 支持手动点击按钮触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣. 检出仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣. 设置 QEMU(跨平台模拟器,支持在 amd64 上编译 arm64 架构)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3️⃣. 设置 Docker Buildx(多架构镜像构建核心)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4️⃣. 登录 Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5️⃣. 提取元数据(自动处理标签)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/debian-tor
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      # 6️⃣. 构建并推送多架构镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 核心重点：声明同时构建 amd64 和 arm64
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
